name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

env:
  TEST_TAG: pokerfaz/task-api:test
  IMAGE_TAG: pokerfaz/task-api:${{ github.sha }}
  LATEST_TAG: pokerfaz/task-api:latest

jobs:
  test-and-build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Bandit
        run: bandit -r app

      - name: Run Ruff
        run: ruff check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_TAG }} .
          docker tag ${{ env.IMAGE_TAG }} ${{ env.LATEST_TAG }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Deploy to Kubernetes (Main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          kubectl config use-context docker-desktop
          kubectl apply -f deployment.yaml
          kubectl set image deployment/task-api-deployment task-api=${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/task-api-deployment --timeout=90s